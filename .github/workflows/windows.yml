name: Windows deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare offline dependencies
        run: >-
          python -m pip download --only-binary=:all: --dest wheelhouse -r requirements.txt
      - name: Install from offline dependencies
        run: python -m pip install --no-index --find-links=wheelhouse -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Test using temporary databases and exports
        run: python -m pytest -q
