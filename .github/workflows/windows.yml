name: Windows deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare offline dependencies
        run: >-
          python -m pip download --only-binary=:all: --dest wheelhouse -r requirements.txt
      - name: Install from offline dependencies
        run: python -m pip install --no-index --find-links=wheelhouse -r requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Check Windows regressions first
        run: >-
          python -m pytest -q
          tests/test_checklist_extraction.py::test_extraction_is_byte_for_byte_deterministic
          tests/test_checklist_extraction.py::test_validation_command_imports_full_library
          tests/test_export_jobs.py::test_export_api_builds_downloadable_manifest_and_is_idempotent
      - name: Test using temporary databases and exports
        run: python -m pytest -q --durations=10
